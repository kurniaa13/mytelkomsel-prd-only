<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototipe Beli Paket MyTelkomsel (PRD Only)</title>
<style>
:root{--red:#e60012;--ink:#1a1a1a;--mut:#666;--bg:#f4f5f7;--ok:#0a7d33;--err:#b3261e}
*{box-sizing:border-box}
body{margin:0;font:16px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--ink)}
#app{max-width:430px;margin:0 auto;min-height:100vh;padding:16px 16px 84px}
h1{font-size:20px;margin:4px 0 12px}h2{font-size:17px;margin:0 0 8px}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px #0001}
.btn{display:block;width:100%;padding:12px;border:0;border-radius:10px;background:var(--red);color:#fff;font-family:inherit;font-size:16px;font-weight:600;cursor:pointer;margin-top:8px}
.btn.sec{background:#fff;color:var(--red);border:1.5px solid var(--red)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{padding:2px 10px;border-radius:99px;font-size:13px;font-weight:600}
.ok{background:#dff3e4;color:var(--ok)}.err{background:#fbe4e2;color:var(--err)}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;max-width:430px;margin:0 auto}
nav button{flex:1;padding:12px 4px;border:0;background:none;font-family:inherit;font-size:14px;color:var(--mut)}
nav button.on{color:var(--red);font-weight:700}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #eee;text-align:left}
.sp{width:36px;height:36px;border:4px solid #ddd;border-top-color:var(--red);border-radius:50%;animation:s 1s linear infinite;margin:16px auto}
@keyframes s{to{transform:rotate(360deg)}}
.hemat .sp{animation:none}
.demo{font-size:13px;color:var(--mut)}
select{font-size:15px;padding:6px}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav"></nav>
<script>
const PK=[
{id:'p4',n:'Data 3 GB',gb:3,h:20000,d:'3 hari'},
{id:'p1',n:'Data 5 GB',gb:5,h:35000,d:'7 hari'},
{id:'p2',n:'Data 12 GB',gb:12,h:65000,d:'30 hari'},
{id:'p3',n:'Data 25 GB',gb:25,h:100000,d:'30 hari'}];
const rp=n=>'Rp'+n.toLocaleString('id-ID');
const pk=id=>PK.find(p=>p.id===id);
const chip=s=>`<span class="chip ${s==='Berhasil'?'ok':'err'}">${s}</span>`;
let S={view:'beranda',kuota:1.2,sel:null,cmp:[],vstep:0,fail:false,hemat:false,hist:[],cur:0,f:'semua',t:'semua'};
try{S.hist=JSON.parse(localStorage.getItem('h')||'[]');S.kuota=parseFloat(localStorage.getItem('k'))||1.2}catch(e){}
const save=()=>{try{localStorage.setItem('h',JSON.stringify(S.hist));localStorage.setItem('k',S.kuota)}catch(e){}};
const NAV=[['beranda','Beranda'],['paket','Beli Paket'],['riwayat','Riwayat Transaksi'],['bantuan','Bantuan']];
const FLOW=['paket','banding','verif','bayar','proses','konfirmasi'];
function V(){
 const v=S.view;
 if(v==='beranda')return `<h1>MyTelkomsel</h1>
 <div class="card"><div>Sisa kuota</div><h2>${S.kuota.toFixed(1)} GB</h2></div>
 <button class="btn" data-a="go" data-v="paket">Beli Paket</button>
 <div class="card" style="margin-top:12px"><b>Status transaksi terakhir</b>${S.hist[0]?`<div class="row"><span>${S.hist[0].paket}</span>${chip(S.hist[0].status)}</div><button class="btn sec" data-a="det" data-i="0">Lihat detail</button>`:'<p>Belum ada transaksi.</p>'}</div>
 <label class="card row"><span>Mode Hemat Data</span><input type="checkbox" data-a="hemat" ${S.hemat?'checked':''}></label>
 <p class="demo">Prototipe dengan data contoh, bukan aplikasi resmi Telkomsel.</p>`;
 if(v==='paket')return `<h1>Pilih Paket</h1>${PK.map(p=>`<div class="card"><div class="row"><b>${p.n}</b><b>${rp(p.h)}</b></div><div class="demo">Masa aktif ${p.d}</div>
 <button class="btn" data-a="pick" data-id="${p.id}">Pilih paket</button>
 <button class="btn sec" data-a="cmp" data-id="${p.id}">${S.cmp.includes(p.id)?'Dipilih untuk dibandingkan ✓':'Bandingkan'}</button></div>`).join('')}
 <button class="btn" data-a="go" data-v="banding" ${S.cmp.length<2?'disabled':''}>Lihat perbandingan (${S.cmp.length}/2)</button>`;
 if(v==='banding'){const [a,b]=S.cmp.map(pk);return `<h1>Bandingkan Paket</h1><div class="card"><table><tr><th></th><th>${a.n}</th><th>${b.n}</th></tr>
 <tr><td>Kuota</td><td>${a.gb} GB</td><td>${b.gb} GB</td></tr><tr><td>Harga</td><td>${rp(a.h)}</td><td>${rp(b.h)}</td></tr>
 <tr><td>Masa aktif</td><td>${a.d}</td><td>${b.d}</td></tr><tr><td>Per GB</td><td>${rp(Math.round(a.h/a.gb))}</td><td>${rp(Math.round(b.h/b.gb))}</td></tr></table></div>
 <button class="btn" data-a="pick" data-id="${a.id}">Pilih ${a.n}</button><button class="btn" data-a="pick" data-id="${b.id}">Pilih ${b.n}</button>
 <button class="btn sec" data-a="go" data-v="paket">Kembali ke daftar paket</button>`}
 if(v==='verif')return `<h1>Verifikasi Nomor</h1><div class="card"><p>Nomor: 0812-****-1234</p>${S.vstep===0?
 `<p>Kami perlu memastikan nomor ini milik kamu sebelum pembayaran.</p><button class="btn" data-a="v1">Verifikasi</button>`:
 `<p><b>Diminta verifikasi ulang.</b></p><p>Alasan: demi keamanan, pembelian perlu dikonfirmasi sekali lagi. Pembelian kamu belum diproses sampai langkah ini selesai.</p><button class="btn" data-a="v2">Konfirmasi dan lanjut</button>`}</div>`;
 if(v==='bayar')return `<h1>Pembayaran</h1><div class="card"><div class="row"><span>${S.sel.n}</span><b>${rp(S.sel.h)}</b></div></div>
 <div class="card"><b>Metode bayar</b><p><label><input type="radio" name="m" checked> Pulsa</label></p><p><label><input type="radio" name="m"> E-wallet</label></p><p><label><input type="radio" name="m"> Transfer bank</label></p></div>
 <label class="demo"><input type="checkbox" data-a="fail" ${S.fail?'checked':''}> Simulasikan transaksi gagal (demo)</label>
 <button class="btn" data-a="pay">Bayar ${rp(S.sel.h)}</button>`;
 if(v==='proses')return `<h1>Pembayaran diproses</h1><div class="card" style="text-align:center"><div class="sp"></div><p>Pembayaran sedang diproses. Mohon tunggu sebentar dan jangan tutup halaman ini.</p></div>`;
 if(v==='konfirmasi'){const t=S.hist[0],ok=t.status==='Berhasil';return `<h1>${ok?'Pembelian berhasil':'Pembayaran gagal'}</h1><div class="card">${chip(t.status)}${D(t)}</div>
 ${ok?'':'<p>Pembayaran belum berhasil. Kamu bisa mencoba lagi atau membuka Bantuan.</p>'}
 <button class="btn" data-a="det" data-i="0">Lihat Riwayat</button>${ok?'':'<button class="btn sec" data-a="go" data-v="bantuan">Buka Bantuan</button>'}
 <button class="btn sec" data-a="go" data-v="beranda">Kembali ke Beranda</button>`}
 if(v==='riwayat'){const L=S.hist.map((t,i)=>[t,i]).filter(([t])=>(S.f==='semua'||t.status===S.f)&&(S.t==='semua'||new Date(t.ts).toDateString()===new Date().toDateString()));
 return `<h1>Riwayat Transaksi</h1><div class="card row"><select data-a="ff"><option value="semua">Semua status</option><option ${S.f==='Berhasil'?'selected':''}>Berhasil</option><option ${S.f==='Gagal'?'selected':''}>Gagal</option></select>
 <select data-a="ft"><option value="semua">Semua tanggal</option><option value="hari" ${S.t==='hari'?'selected':''}>Hari ini</option></select></div>
 ${L.length?L.map(([t,i])=>`<div class="card"><div class="row"><b>${t.paket}</b>${chip(t.status)}</div><div class="demo">${t.waktu}</div><button class="btn sec" data-a="det" data-i="${i}">Lihat detail</button></div>`).join(''):'<p>Belum ada transaksi yang cocok.</p>'}`}
 if(v==='detail'){const t=S.hist[S.cur];return `<h1>Detail Transaksi</h1><div class="card">${chip(t.status)}${D(t)}</div><button class="btn sec" data-a="go" data-v="riwayat">Kembali ke riwayat</button>`}
 if(v==='bantuan')return `<h1>Bantuan</h1><div class="card"><details><summary>Transaksi gagal atau tertunda</summary><p>Cek status di Riwayat Transaksi. Jika masih gagal, coba lakukan pembayaran lagi.</p></details>
 <details><summary>Kenapa diminta verifikasi ulang?</summary><p>Verifikasi ulang dipakai untuk keamanan. Pembelian baru diproses setelah verifikasi selesai.</p></details></div>`;
}
const D=t=>`<table><tr><td>Paket</td><td>${t.paket}</td></tr><tr><td>Harga</td><td>${rp(t.harga)}</td></tr><tr><td>Waktu</td><td>${t.waktu}</td></tr><tr><td>ID</td><td>${t.id}</td></tr></table>`;
function R(){
 document.getElementById('app').innerHTML=V();
 document.getElementById('app').className=S.hemat?'hemat':'';
 const on=FLOW.includes(S.view)?'paket':S.view==='detail'?'riwayat':S.view;
 document.getElementById('nav').innerHTML=NAV.map(([k,l])=>`<button data-a="go" data-v="${k}" class="${on===k?'on':''}">${l}</button>`).join('');
}
function go(v){if(v==='paket'&&S.view!=='banding')S.cmp=S.cmp;S.view=v;R();scrollTo(0,0)}
function finish(){
 if(S.view!=='proses')return;
 const ok=!S.fail,p=S.sel,n=new Date();
 S.hist.unshift({id:'TRX'+String(Date.now()).slice(-6),paket:p.n,harga:p.h,waktu:n.toLocaleString('id-ID'),ts:n.getTime(),status:ok?'Berhasil':'Gagal'});
 if(ok)S.kuota+=p.gb;
 save();S.view='konfirmasi';R();
}
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,d=t.dataset;
 if(a==='go')go(d.v);
 else if(a==='pick'){S.sel=pk(d.id);S.vstep=0;go('verif')}
 else if(a==='cmp'){S.cmp=S.cmp.includes(d.id)?S.cmp.filter(x=>x!==d.id):[...S.cmp,d.id].slice(-2);R()}
 else if(a==='v1'){S.vstep=1;R()}
 else if(a==='v2')go('bayar');
 else if(a==='pay'){S.view='proses';R();setTimeout(finish,2200)}
 else if(a==='det'){S.cur=+d.i;go('detail')}
});
document.addEventListener('change',e=>{
 const a=e.target.dataset.a;
 if(a==='hemat'){S.hemat=e.target.checked;R()}
 else if(a==='fail')S.fail=e.target.checked;
 else if(a==='ff'){S.f=e.target.value;R()}
 else if(a==='ft'){S.t=e.target.value;R()}
});
R();
</script>
</body>
</html>
